cmd_vel_odrive_bridge:
  ros__parameters:
    cmd_vel_topic: "/cmd_vel"
    enable_service: "/aries_drive/enable"
    enabled_topic: "/aries_drive/enabled"
    status_topic: "/aries_drive/status"

    num_axes: 6
    # CAN node id -> physical wheel. Re-verified 2026-08-23 by arming one axis
    # at a time and watching which physical wheel moved; the node ids were
    # reassigned since the 2026-08-12 mapping and now follow the sides in
    # contiguous blocks:
    #   0 Front-Left    1 Middle-Left   2 Back-Left
    #   3 Back-Right    4 Middle-Right  5 Front-Right
    #
    # Both lists below are written FRONT -> REAR, which is why the right side
    # reads [5, 4, 3] and not [3, 4, 5]: node ids happen to ascend front-to-rear
    # on the left and rear-to-front on the right. Do not "tidy" either list into
    # ascending node-id order -- that contradicts the front->rear convention.
    # (Order is in fact cosmetic to both consumers: the bridge sends every wheel
    # on a side the same command, and Odom.py takes a per-side median. It only
    # affects which axis id gets named in slip-outlier log messages.)
    #
    # Independently corroborated 2026-08-26 from accumulated encoder positions
    # on the live bus: nodes 0/1/2 agreed to within 0.30 rev and 3/4/5 to
    # within 0.40 rev, with ~12 rev between the groups. Re-check by hand,
    # without arming any motor, using identify_wheel_axes.py at the workspace
    # root.
    #
    # rover_nav/Odom.py takes the same two parameters and must be given the
    # same values, or odometry reads the sides backwards.
    right_wheels: [5, 4, 3]
    left_wheels: [0, 1, 2]

    # Must stay consistent with rover_nav/Odom.py.
    wheel_circumference_m: 0.697
    track_width_m: 0.566

    max_linear_mps: 0.45
    max_angular_rps: 2.10
    max_wheel_rps: 1.50
    wheel_accel_rps2: 3.0
    command_timeout_s: 0.25
    # Twenty Hz is responsive at rover speed while leaving headroom on the
    # 250 kbit/s bus for six 100 Hz encoder streams and status responses.
    publish_rate_hz: 20.0

    arm_retry_period_s: 2.0
    axis_state_request_timeout_s: 3.0
    auto_arm: false
