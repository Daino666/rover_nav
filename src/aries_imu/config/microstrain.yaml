# MicroStrain by HBK 3DM-GX5-AHRS overrides.
#
# Layered on top of the driver's own params.yml, which imu.launch.py loads
# first exactly the way microstrain_launch.py does. Only settings that differ
# from the driver defaults belong here; port, baudrate and frame_id are
# overridden again from launch arguments after this file.
#
# Keyed to the fully-qualified node name rather than "/**" on purpose: a
# wildcard block is inherited by every node that loads the file, so a shared
# parameter name silently retunes an unrelated node. The launch file must keep
# namespace=microstrain and name=microstrain_inertial_driver in sync with this
# key. Verified against microstrain_inertial_driver 4.8.0.
/microstrain/microstrain_inertial_driver:
  ros__parameters:
    # Configure the device on connect rather than trusting whatever was last
    # written to non-volatile memory by SensorConnect, but do not persist it.
    device_setup: true
    save_settings: false

    # REP-103. The device talks NED natively; leaving this false would flip yaw
    # for robot_localization and TF, and would also append "_ned" to frame_id.
    use_enu_frame: true

    # base_link -> imu_frame is a fixed joint in aries_base.xacro, so
    # robot_state_publisher already owns that transform. The driver default is
    # true, which would publish a competing base_link -> frame_id transform;
    # the driver's own docs recommend defining it in the URDF instead.
    publish_mount_to_frame_id_transform: false

    # imu/data carries the raw sensor data set.
    imu_data_rate: 100

    # imu/mag carries the raw magnetometer vector (off by default). Enabled
    # purely for observability -- lets imu_deep_log.py see the actual field
    # magnitude directly, the most direct evidence of real EMI (a genuine
    # disturbance changes the field's magnitude, not just its direction).
    # Doesn't affect fusion; nothing consumes this topic.
    imu_mag_data_rate: 100

    # ekf/imu/data carries the estimation-filter output, which is where the
    # AHRS absolute heading lives. Off by default (0); enabled so the topic is
    # available to switch the EKF over to without restarting the stack.
    filter_imu_data_rate: 100

    # Heading source 1 = magnetometer. The GX5-AHRS has no GNSS, so the
    # magnetometer is the only absolute yaw reference available.
    #
    # TRIED filter_heading_source: 0 (disable magnetometer entirely) on
    # 2026-08-19, based on imu_deep_log.py CSVs showing real magnetometer
    # disturbance (magnitude range comparable to Earth's field itself)
    # isolated to the orientation channel (raw vs AHRS-fused vyaw tracked
    # within 1.00x -- vyaw itself is not corrupted, so the earlier "AHRS
    # fusion blends disturbance into vyaw" hypothesis is refuted). Assumed
    # 0 would degrade gracefully to pure gyro integration; it did not --
    # on real hardware, yaw stopped updating entirely on a U-turn (rover
    # kept treating "forward" as the same world-frame direction regardless
    # of actual heading). Likely cause: this AHRS's internal Kalman filter
    # probably can't establish/hold a yaw state at all without some
    # absolute reference (yaw isn't observable from gyro+accel alone), so
    # heading_source:0 doesn't mean "clean open-loop integration" the way
    # it does on some other AHRS firmware -- it more likely means "yaw
    # never gets initialized/updated." This is strictly worse than the
    # EMI-driven drift it was meant to fix. Do not retry 0 without first
    # confirming (e.g. via MicroStrain's own docs/support) what heading
    # source 0 actually does on this specific GX5-AHRS firmware.
    filter_heading_source: 1

    # Fused yaw was observed drifting specifically while the rover drives
    # (stable when stationary) -- consistent with motor-current EMI
    # corrupting the magnetometer, the sole absolute heading reference above.
    # filter_adaptive_level (driver default: 2/Moderate) is meant to reject
    # exactly this kind of disturbance, but its own doc only lists "GQ7/CV7
    # full support, GX5-45 limited support" -- GX5-25 (this unit) isn't
    # mentioned, so it may be a no-op here. Try filtering the raw
    # magnetometer signal itself instead: auto lets the device pick an
    # appropriate cutoff rather than guessing a frequency blind.
    mag_low_pass_filter_enable: true
    mag_low_pass_filter_auto: true

    # GNSS-derived global odometry. Meaningless on an AHRS and on by default at
    # 25 Hz, so silence both rather than pay for topics that never populate.
    filter_odometry_earth_data_rate: 0
    filter_odometry_map_data_rate: 0

    # Diagonal covariances published on sensor_msgs/Imu. The GX5-25 datasheet
    # gives +/-0.25 deg static roll/pitch and +/-0.8 deg heading; these are
    # deliberately looser than spec so the EKF does not over-trust the IMU
    # while the rover drives and the magnetometer sees motor current.
    #
    # yaw (bottom-right entry) loosened further, from 0.0025 (~2.9deg std)
    # to 0.08 (~16deg std): real driving tests showed fused yaw
    # tracking the AHRS's own raw absolute-yaw output nearly exactly (swings
    # matched to within 0.3deg across a 60s run -- confirmed via
    # yaw_source_compare.py -- so robot_localization's EKF wasn't the
    # problem), with real swings up to 10-15deg correlated with aggressive
    # turning, consistent with motor-current EMI on the magnetometer. This
    # widens robot_localization's trust in each individual absolute-yaw
    # sample to roughly cover that observed disturbance band, so it leans on
    # the gyro-derived vyaw (not magnetometer-dependent, and excellent per
    # imu_noise_check.py's stationary measurement) for moment-to-moment
    # continuity instead of chasing every EMI-induced swing, while still
    # slowly reconciling to the AHRS's absolute heading given enough
    # consistent samples. Re-test after this; if drift persists, the next
    # step is a raw gyro+magnetometer CSV logger for deeper analysis rather
    # than more covariance guessing.
    imu_orientation_cov: [0.0004, 0.0,    0.0,
                          0.0,    0.0004, 0.0,
                          0.0,    0.0,    0.08]
    imu_angular_cov: [0.00004, 0.0,     0.0,
                      0.0,     0.00004, 0.0,
                      0.0,     0.0,     0.00004]
    imu_linear_cov: [0.002, 0.0,   0.0,
                     0.0,   0.002, 0.0,
                     0.0,   0.0,   0.002]
