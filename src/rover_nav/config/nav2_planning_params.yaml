map_server:
  ros__parameters:
    use_sim_time: false
    # Static fallback only -- nav2_planning.launch.py overrides this with its
    # portable `map_yaml` argument (defaults to <home>/jazzy_ws/marsyard/...,
    # marsyard/ sits as a top-level sibling of src/, not inside it -- see
    # "Fold Mars-rover, obstacle_detection, and marsyard data into this repo").
    # This value only applies if map_server is started directly against this
    # params file without going through that launch file.
    yaml_filename: "/home/daino/jazzy_ws/marsyard/marsyard2026_occupancy.yaml"
    topic_name: "map"
    frame_id: "map"

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.1
      # Collision footprint the planner checks against. Undeclared, this
      # defaults to nav2's 0.1 m -- a 20 cm rover -- which SmacPlanner2D got
      # away with but Hybrid-A* must not, since its whole value here is that
      # the poses it returns are actually drivable.
      # The rover is ~0.8 x 0.83 m, so a true half-width of ~0.41 m. The
      # occupancy grid bakes in 0.10 m of inflation (INFLATE_RADIUS_M in
      # generate_occupancy_grid.py), so this covers the rest: 0.10 + 0.30 =
      # 0.40 m, near enough the real half-width. Keeping most of the margin
      # here rather than in the PGM means it is one explicit, tunable number
      # the planner checks a footprint against, instead of being baked
      # irreversibly into the map image.
      robot_radius: 0.30
      track_unknown_space: false
      always_send_full_costmap: true
      rolling_window: false
      # Without explicit values these can default to effectively never firing
      # the update/publish timer on a fully-static map (no obstacle-layer
      # updates ever trigger it otherwise) -- smoother_server's costmap
      # subscription then never receives anything, "Costmap is not available".
      update_frequency: 1.0
      publish_frequency: 1.0
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # cost_scaling_factor controls how sharply cost decays away from an
        # obstacle -- lower = cost stays elevated further out, pulling the
        # planner's chosen path further toward the centerline of open space.
        cost_scaling_factor: 3.0
        # How far (m) the inflation cost gradient extends past each obstacle.
        # Matches the scale of the corridors in this yard; tune if paths
        # still look too close to obstacles.
        inflation_radius: 1.0

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      # Hybrid-A* rather than SmacPlanner2D. SmacPlanner2D searches an
      # 8-connected grid, so its output is built out of 45/90-degree corners
      # and has no notion of curvature at all -- a smoother can round those
      # corners afterwards but cannot bound how tight they get. Hybrid-A*
      # searches over kinematically feasible motion primitives instead, so
      # minimum_turning_radius below is enforced *during* the search and
      # every pose on the returned path already respects it.
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0

      # The curvature bound. 1.0 m, not the 2.0 m of MIN_SAFE_RADIUS in
      # scripts/test_paths/generate_test_paths.py.
      #
      # 2.0 m is where this rocker-bogie stops scrubbing its wheels against
      # each other's arcs -- a wear/slip threshold, not a mechanical limit
      # (differential/skid steering can pivot on the spot, zero radius).
      # Measured against this yard, 2.0 m is simply wider than the terrain
      # allows: of the nine W markers only W2 and W4 have 2 m of clearance
      # anywhere within 3 m, so at 2.0 m the planner can only pass through
      # the rest in a near-straight line. That makes whole routes
      # unplannable for want of a turn -- W6 in particular must be entered
      # heading west and left heading east, which no 2.0 m arc can do.
      #
      # First relaxed to 1.5 m (curvature 0.667 1/m) to open those corridors,
      # then to 1.0 m (curvature 1.0 1/m) for the hand-drawn-path workflow
      # (draw_path.py): dense, tightly-turning drawn routes through narrow
      # corridors otherwise forced the planner into wide loops just to stay
      # inside a radius the corridor didn't have room for -- see
      # rover_nav/README.md's draw-path section.
      #
      # Lowered to 0.5 m 2026-09-03 -- as tight as this can go. 0.5 m is not
      # arbitrary: it is EXACTLY cmd_vel_arbiter.py's own max_curvature=2.0
      # (1/0.5) pure-pursuit clamp, the tightest turn the live follower will
      # ever execute. Going any tighter than that would let the planner hand
      # the follower a curve it physically refuses to track at runtime (its
      # own clamp caps it), recreating the exact "circles instead of
      # following the plan" failure this bound exists to prevent -- so this
      # is the floor, not a step toward zero.
      #
      # NOTE: this is still NOT a true in-place pivot. motion_model_for_search
      # is DUBIN (forward-only, see below) -- Hybrid-A* keeps moving forward
      # while turning even at this radius, it does not stop and spin. A real
      # zero-radius pivot would need REEDS_SHEPP or a dedicated spin-in-place
      # behaviour in cmd_vel_arbiter itself, neither of which this does.
      minimum_turning_radius: 0.5

      # DUBIN = forward-only primitives. The rover drives at a constant
      # positive base_velocity and pure pursuit has no reverse gear, so
      # REEDS_SHEPP paths (which use backing-up manoeuvres) would produce
      # plans the follower physically cannot execute.
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72          # 5-degree heading resolution

      # Penalties. non_straight_penalty is the "prefer straight" knob: every
      # turning primitive costs this multiple of a straight one, so the
      # planner spends curvature only where it buys a genuinely shorter
      # route. change_penalty additionally discourages switching turn
      # direction, which is what removes S-wiggles down open corridors.
      non_straight_penalty: 1.35
      change_penalty: 0.15
      cost_penalty: 2.0                    # bias away from inflated cells
      retrospective_penalty: 0.015

      # Analytic (Dubins) expansion: once the search gets near the goal it
      # tries to connect analytically, which is what produces the long clean
      # closing arc instead of a stack of small primitives.
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0

      lookup_table_size: 20.0
      cache_obstacle_heuristic: false

      # Hybrid-A*'s own smoother is deliberately OFF. It is a plain
      # gradient-descent smoother with no curvature term, so it pulls the
      # path locally tighter than the search guaranteed: measured over the
      # S1-S3-S4-S5-S1 tour it produced two poses at a 1.32 m radius, inside
      # the 2.0 m the search had honoured everywhere. Off, the path is pure
      # Dubins arcs and straight segments -- already smooth by construction --
      # and the radius bound holds exactly (max curvature 0.500 1/m, zero
      # violations) for 0.7 m more length over an 82 m tour.
      smooth_path: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    # smoother_server defaults to a "local_costmap" topic that doesn't exist
    # in this planning-only stack; planner_server's internal costmap actually
    # publishes here instead. Needed even with check_for_collision=False --
    # smoother_server subscribes to this unconditionally at startup.
    costmap_topic: "/global_costmap/costmap_raw"
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
      refinement_num: 2

lifecycle_manager_planning:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["map_server", "planner_server", "smoother_server"]
