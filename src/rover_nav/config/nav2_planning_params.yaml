map_server:
  ros__parameters:
    use_sim_time: false
    # yaml_filename is overridden at launch time by the 'map' argument.
    yaml_filename: "marsyard2026_occupancy.yaml"
    topic_name: "map"
    frame_id: "map"

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.1
      # Real chassis footprint (base_footprint frame, X forward/Y left), read
      # directly from aries/meshes/base_link_v3.stl's bounding box -- nothing
      # was set before, so nav2_costmap_2d silently defaulted to a 0.1 m
      # circular robot_radius (the actual rover is ~0.71 m wide, ~0.90 m
      # long, and the rear overhangs the base_link origin much further than
      # the front: X -0.635..+0.261 m, Y -0.330..+0.380 m). This is also what
      # was behind SmacPlanner2D's "HIGHLY recommended to set the inflation
      # radius to be at MINIMUM half of the robot's largest cross-section"
      # warning -- it had no real footprint to judge that against.
      footprint: "[[0.261, 0.380], [0.261, -0.330], [-0.635, -0.330], [-0.635, 0.380]]"
      track_unknown_space: false
      always_send_full_costmap: true
      rolling_window: false
      # Without explicit values these can default to effectively never firing
      # the update/publish timer on a fully-static map (no obstacle-layer
      # updates ever trigger it otherwise) -- smoother_server's costmap
      # subscription then never receives anything, "Costmap is not available".
      update_frequency: 1.0
      publish_frequency: 1.0
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # cost_scaling_factor controls how sharply cost decays away from an
        # obstacle -- lower = cost stays elevated further out, pulling the
        # planner's chosen path further toward the centerline of open space.
        # cost = 252 * exp(-cost_scaling_factor * distance), so
        # cost_scaling_factor * inflation_radius sets how much the cost has
        # decayed by the radius's edge -- kept at the original 3.0 * 1.0
        # product (was 3.0 when inflation_radius was 1.0) so shrinking the
        # radius doesn't also flatten the decay curve: 3.0 * (1.0/0.56).
        cost_scaling_factor: 5.36
        # How far (m) the inflation cost gradient extends past each obstacle.
        # Matches the scale of the corridors in this yard; tune if paths
        # still look too close to obstacles.
        inflation_radius: 0.56

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    # smoother_server defaults to a "local_costmap" topic that doesn't exist
    # in this planning-only stack; planner_server's internal costmap actually
    # publishes here instead. Needed even with check_for_collision=False --
    # smoother_server subscribes to this unconditionally at startup.
    costmap_topic: "/global_costmap/costmap_raw"
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
      refinement_num: 2

lifecycle_manager_planning:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["map_server", "planner_server", "smoother_server"]
