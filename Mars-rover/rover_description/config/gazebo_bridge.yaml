- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Joint states: gz_ros2_control's joint_state_broadcaster publishes all 12 joints
# (wheels, rockers, bogies, aux) directly to ROS /joint_states with unified timestamps.
# Bridging Gazebo's /joint_states creates duplicate conflicting messages with out-of-sync
# timestamps, causing robot_state_publisher time jumps and RViz 3D model glitching.
# - ros_topic_name: "/joint_states"
#   gz_topic_name: "/joint_states"
#   ros_type_name: "sensor_msgs/msg/JointState"
#   gz_type_name: "gz.msgs.Model"
#   direction: GZ_TO_ROS



# Gazebo's OdometryPublisher plugin also broadcasts odom->base_footprint on
# /model/aries/tf (ground-truth sim pose). Bridging it onto ROS /tf collides
# with odom_tf_broadcaster.py, which publishes the same edge from the
# EKF-filtered /odometry/filtered. Two unsynchronized publishers for the same
# TF edge causes constant "jump back in time" TF buffer resets in every
# consumer (EKF, costmap, smoother, PCL filters), stalling localization and
# breaking the map<->robot transform. Bridge left disabled intentionally.
# - ros_topic_name: "/tf"
#   gz_topic_name: "/model/aries/tf"
#   ros_type_name: "tf2_msgs/msg/TFMessage"
#   gz_type_name: "gz.msgs.Pose_V"
#   direction: GZ_TO_ROS


- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/aries/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# IMU data. Bridged as raw "/imu" (not "/imu/synced" directly) so it passes
# through imu_restamp.py first -- Gazebo's IMU sensor reports all-zero
# covariance, which makes robot_localization's EKF lock up (see
# imu_restamp.py docstring); imu_restamp.py fixes that before EKF sees it.
- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS



